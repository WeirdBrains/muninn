[package]
name = "weirdnet-render"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Weirdnet render: structured data (tables, line charts, or JSON describing either) drawn to PNG, with input checks and size limits."
authors = ["Michael Christenson II <m3talsmith@gmail.com>"]
license = "BSD-3-Clause"
# Source lives in this monorepo until it gets a home of its own.
repository = "https://github.com/WeirdBrains/muninn"
readme = "README.md"
keywords = ["png", "chart", "table", "render", "json"]
categories = ["visualization", "multimedia::images"]
include = ["src/**", "README.md", "LICENSE"]
publish = false

[dependencies]
thiserror = "2"
serde_json = "1"
png = "0.18"
# 8x8 bitmap glyphs (MIT) for table text
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }
