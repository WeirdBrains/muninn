# Read by the Flutter app's Native Assets build (app/hook/build.dart, native_toolchain_rust),
# which needs a pinned version and the target list. Only applies inside this directory.
[toolchain]
channel = "1.99.1"
targets = [
  # Android
  "armv7-linux-androideabi",
  "aarch64-linux-android",
  "x86_64-linux-android",
  # iOS (device + simulator)
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
  # macOS
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  # Linux
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  # Windows
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
