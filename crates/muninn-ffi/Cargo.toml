[package]
name = "muninn_ffi"
version.workspace = true
edition = "2024"
rust-version = "1.99"
description = "flutter_rust_bridge API over muninn-core for the Muninn Flutter app."
license = "BSD-3-Clause"
publish = false

[lib]
name = "muninn_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
muninn-core = { path = "../muninn-core" }
flutter_rust_bridge = "=2.13.0"
anyhow = "1"
secrecy = "0.10"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }
