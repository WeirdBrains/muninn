[package]
name = "weirdnet-pipelines"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Weirdnet pipelines: graphs (DAGs) of application-defined sources, steps and sinks; parsing, validation, ordering, a runner that reaches the application through a host trait, and helpers for JSON column frames."
authors = ["Michael Christenson II <m3talsmith@gmail.com>"]
license = "BSD-3-Clause"
# Source lives in this monorepo until it gets a home of its own.
repository = "https://github.com/WeirdBrains/muninn"
readme = "README.md"
keywords = ["pipeline", "dag", "dataflow", "graph", "frames"]
categories = ["data-structures"]
include = ["src/**", "README.md", "LICENSE"]
publish = false

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# frames keep their columns in the order they were made
serde_json = { version = "1", features = ["preserve_order"] }
