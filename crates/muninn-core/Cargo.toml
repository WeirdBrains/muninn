[package]
name = "muninn-core"
version.workspace = true
edition = "2024"
rust-version = "1.99"
description = "Muninn's library: storage, ingest, crypto, network, themes and the TUI widgets, shared by mnnn and the Flutter app."
authors = ["Michael Christenson II <m3talsmith@gmail.com>"]
license = "BSD-3-Clause"
repository = "https://github.com/WeirdBrains/muninn"
publish = false
build = "build.rs"

[lib]
name = "muninn_core"
path = "src/lib.rs"

[dependencies]
# Python code spaces: parsed in pure Rust (ruff, pinned) and translated with the vendored
# python-ast code generation (no pyo3, no libpython); see vendor/python-ast/VENDORED.md
ruff_python_parser = "=0.0.20"
ruff_python_ast = "=0.0.20"
ruff_text_size = "=0.0.20"
python-ast = { workspace = true }
clap = { version = "4.6", features = ["env", "string", "unicode", "derive", "cargo"] }
clap_mangen = "0.2"
polars = { version = "0.55", features = ["lazy", "csv", "json", "parquet", "dtype-datetime", "strings", "temporal"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
toml = "0.9"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl", "backup", "blob"] }
uuid = { version = "1", features = ["v4"] }
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# `date -d` style times for schedules (start_at, ends_at); approved by Michael (Q-T3)
parse_datetime = "0.17"
bip39 = "2"
vsss-rs = { version = "5", features = ["std"] }
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
age = "0.11"
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.10"
getrandom = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
base64 = "0.22"
ratatui = "0.30"
weirdnet-themes = { version = "0.1.0", path = "../weirdnet-themes", features = ["ratatui"] }
weirdnet-storage = { version = "0.1.0", path = "../weirdnet-storage" }
crossterm = "0.29"
rpassword = "7"
dirs = "6"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
redis = { version = "0.32", default-features = false, features = ["tls-rustls", "tls-rustls-webpki-roots"] }
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = { version = "0.2", features = ["vendored"] }
tar = "0.4"
zstd = "0.13"
tempfile = "3"
ctrlc = "3"
pdf-writer = "0.15"
ttf-parser = "0.25"
subsetter = { version = "0.2", default-features = false }
png = "0.18"
flate2 = "1"
crc32fast = "1"
libloading = "0.8"
# Decentralized network (2.6): libp2p over TCP and QUIC with Noise + Yamux, mDNS, Kademlia,
# identify, ping, relay + DCUtR, AutoNAT and request-response; QUIC brings rustls with aws-lc-rs.
libp2p = { version = "0.57", default-features = false, features = ["tokio", "tcp", "quic", "dns", "noise", "yamux", "mdns", "kad", "identify", "ping", "relay", "dcutr", "autonat", "request-response", "cbor", "macros", "ed25519"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
futures = "0.3"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
# Organization hosting (2.7): HTTPS (HTML, JSON and unary gRPC) with hyper and rustls,
# self-signed certificates with rcgen, Let's Encrypt (ACME) with instant-acme.
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
time = "0.3"
instant-acme = "0.8"
prost = { version = "0.14", features = ["derive"] }
hmac = "0.12"
x509-parser = "0.18"
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router"] }
tonic-prost = "0.14"
libp2p-tls = "0.7"
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }


[dev-dependencies]
# A gRPC (HTTP/2) client for the hosting tests.
hyper = { version = "1", features = ["client", "http2"] }

[build-dependencies]
protox = "0.10.0"
tonic-prost-build = "0.14"
