[package]
name = "weirdnet-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Weirdnet storage: SQLCipher databases opened with a caller-supplied raw key, rekey and plaintext conversion, an ordered migration runner, savepoints, private files, snapshots and an optional row change log for sync."
authors = ["Michael Christenson II <m3talsmith@gmail.com>"]
license = "BSD-3-Clause"
# Source lives in this monorepo until it gets a home of its own.
repository = "https://github.com/WeirdBrains/muninn"
readme = "README.md"
keywords = ["sqlite", "sqlcipher", "migrations", "sync", "storage"]
categories = ["database"]
include = ["src/**", "README.md", "LICENSE"]
publish = false

[features]
default = ["sync"]
# Row change log, three-way merge decisions and row codecs for syncing databases.
sync = ["dep:serde", "dep:serde_json", "dep:sha2", "dep:base64"]

[dependencies]
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
thiserror = "2"
zeroize = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["float_roundtrip"], optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
tempfile = "3"
