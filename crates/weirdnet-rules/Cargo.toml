[package]
name = "weirdnet-rules"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Weirdnet rules: if-this-then-that over an event history. Condition syntax and comparison, rule specs generic over the application's then-actions, a matching and loop-protected engine behind a host trait, templates, and every/cron schedules."
authors = ["Michael Christenson II <m3talsmith@gmail.com>"]
license = "BSD-3-Clause"
# Source lives in this monorepo until it gets a home of its own.
repository = "https://github.com/WeirdBrains/muninn"
readme = "README.md"
keywords = ["rules", "automation", "cron", "events", "ifttt"]
categories = ["parser-implementations"]
include = ["src/**", "README.md", "LICENSE"]
publish = false

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
chrono-tz = { version = "0.10", default-features = false }
