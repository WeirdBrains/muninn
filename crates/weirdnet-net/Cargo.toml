[package]
name = "weirdnet-net"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Weirdnet networking: a libp2p node (TCP, QUIC, Noise, Yamux, mDNS, Kademlia, relays, hole punching, AutoNAT) carrying the application's own request and response types, signed key-exchange offers and answers with short codes, invitation tokens and links, sealed exchange messaging, node identities, user certificates and cards, under versioned identifier profiles."
authors = ["Michael Christenson II <m3talsmith@gmail.com>"]
license = "BSD-3-Clause"
# Source lives in this monorepo until it gets a home of its own.
repository = "https://github.com/WeirdBrains/muninn"
readme = "README.md"
keywords = ["p2p", "libp2p", "key-exchange", "invitation", "decentralized"]
categories = ["network-programming"]
include = ["src/**", "README.md", "SECURITY.md", "LICENSE"]
publish = false

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
tracing = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
libp2p = { version = "0.57", default-features = false, features = ["tokio", "tcp", "quic", "dns", "noise", "yamux", "mdns", "kad", "identify", "ping", "relay", "dcutr", "autonat", "request-response", "cbor", "macros", "ed25519"] }
# every derivation, seal and open goes through the keys crate
weirdnet-keys = { version = "0.1.0", path = "../weirdnet-keys", default-features = false }
