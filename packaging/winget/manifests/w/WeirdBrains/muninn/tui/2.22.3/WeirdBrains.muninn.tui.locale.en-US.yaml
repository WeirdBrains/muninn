Description: Muninn (mnnn) is a local, encrypted workbench for market data, with a terminal UI and a CLI. Ingest from CSV, JSON, HTTP APIs, Redis, SQLite and Postgres into an encrypted SQLite (SQLCipher) database; run pipelines you can read and edit; and share data peer to peer between your own nodes, connections and organizations, with no central server. Export to CSV, Parquet or JSON.
