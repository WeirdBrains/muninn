# nginx in front of `mnnn mcp serve --http` (see docs/mcp-proxy.md).
#
# This is the alternative to Muninn's built-in TLS (`mnnn mcp serve --tls-domain`, which gets
# and renews its own Let's Encrypt certificate; see docs/mcp.md). Use nginx when it already
# owns ports 80/443 on the machine. Run Muninn without TLS here: it listens on 127.0.0.1:4743 and answers
# POST /mcp with JSON (GET and DELETE get 405; there is no server-sent event stream and
# no session). nginx terminates TLS with a Let's Encrypt certificate and passes requests,
# including the client's `Authorization: Bearer mnnn_mcp_…` header, through unchanged.
#
# Muninn needs no trusted-proxy or advertised-URL setting: it authenticates every request
# by its token and does not build URLs from the Host header. It refuses any request whose
# `Origin` header is not localhost (DNS-rebinding protection), so browser-based clients
# calling https://mcp.example.com get 403; desktop and server-side MCP clients send no
# Origin and are unaffected. The `proxy_set_header Origin ""` line below is commented out
# on purpose; enabling it would turn that protection off.
#
# Install: replace mcp.example.com (5 places), copy to /etc/nginx/conf.d/muninn-mcp.conf
# (Fedora, Arch) or /etc/nginx/sites-available/ + a link in sites-enabled/ (Debian, Ubuntu).
# First certificate: comment out the whole `listen 443` server block, reload nginx, run
# certbot (docs/mcp-proxy.md), then uncomment it and reload again.

# Optional rate limit: 10 requests a second per client address, bursts of 20.
# limit_req_zone $binary_remote_addr zone=muninn_mcp:10m rate=10r/s;

upstream muninn_mcp {
    server 127.0.0.1:4743;
    keepalive 16;
}

# Port 80: Let's Encrypt HTTP-01 challenges, and a redirect for everything else.
server {
    listen 80;
    listen [::]:80;
    server_name mcp.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443: TLS, then the MCP endpoint.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.example.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/mcp.example.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MuninnMCP:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;

    # Muninn takes request bodies up to 4 MiB; nginx refuses bigger ones first.
    client_max_body_size 4m;

    # Tokens are in the Authorization header: keep them out of the access log's request
    # line (they never appear there) and do not log request bodies.
    access_log /var/log/nginx/muninn-mcp.access.log;
    error_log  /var/log/nginx/muninn-mcp.error.log;

    location = /mcp {
        # limit_req zone=muninn_mcp burst=20 nodelay;

        proxy_pass http://muninn_mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # nginx passes Authorization through by default; said here so nobody removes it.
        proxy_set_header Authorization     $http_authorization;
        # proxy_set_header Origin "";      # see the note at the top before enabling

        # Answers are single JSON documents today; unbuffered and uncached so a future
        # streamed answer (text/event-stream) also passes straight through.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        # Runs (code spaces, executables, live searches) can take a while.
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Nothing else is served.
    location / {
        return 404;
    }
}
