[package]
name = "muninn"
version = "2.11.1"
edition = "2024"
rust-version = "1.99"
description = "The data ingestor for the Kommandosaldat project. It ingests data from various sources and normalizes it into a common format."
authors = ["Michael Christenson II <m3talsmith@gmail.com>"]
license = "MIT"
repository = "https://github.com/kommandosaldat/muninn"
homepage = "https://github.com/kommandosaldat/muninn"
keywords = ["data", "ingestion", "normalization", "csv", "sqlite"]
categories = ["command-line-utilities"]
readme = "README.md"
publish = false

[[bin]]
name = "mnnn"
path = "src/main.rs"

[lib]
name = "muninn"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6", features = ["env", "string", "unicode", "derive", "cargo"] }
clap_mangen = "0.2"
polars = { version = "0.55", features = ["lazy", "csv", "json", "parquet", "dtype-datetime", "strings", "temporal"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
toml = "0.9"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl", "backup", "blob"] }
uuid = { version = "1", features = ["v4"] }
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
bip39 = "2"
vsss-rs = { version = "5", features = ["std"] }
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
age = "0.11"
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.10"
getrandom = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
base64 = "0.22"
ratatui = "0.30"
crossterm = "0.29"
terminal-light = "1"
rpassword = "7"
dirs = "6"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
redis = { version = "0.32", default-features = false, features = ["tls-rustls", "tls-rustls-webpki-roots"] }
postgres = "0.19"
postgres-native-tls = "0.5"
native-tls = { version = "0.2", features = ["vendored"] }
tar = "0.4"
zstd = "0.13"
tempfile = "3"
ctrlc = "3"
pdf-writer = "0.15"
ttf-parser = "0.25"
subsetter = { version = "0.2", default-features = false }
png = "0.18"
flate2 = "1"
crc32fast = "1"
libloading = "0.8"
# Decentralized network (2.6): libp2p over TCP and QUIC with Noise + Yamux, mDNS, Kademlia,
# identify, ping, relay + DCUtR, AutoNAT and request-response; QUIC brings rustls with aws-lc-rs.
libp2p = { version = "0.57", default-features = false, features = ["tokio", "tcp", "quic", "dns", "noise", "yamux", "mdns", "kad", "identify", "ping", "relay", "dcutr", "autonat", "request-response", "cbor", "macros", "ed25519"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
futures = "0.3"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
# Organization hosting (2.7): HTTPS (HTML, JSON and unary gRPC) with hyper and rustls,
# self-signed certificates with rcgen, Let's Encrypt (ACME) with instant-acme.
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
time = "0.3"
instant-acme = "0.8"
prost = { version = "0.14", features = ["derive"] }
hmac = "0.12"
x509-parser = "0.18"


[dev-dependencies]
# A gRPC (HTTP/2) client for the hosting tests.
hyper = { version = "1", features = ["client", "http2"] }

# Crypto (scrypt/argon2), SQLCipher and Polars are very slow unoptimized; optimize deps in dev/test.
[profile.dev.package."*"]
opt-level = 2

# Debian/Ubuntu package: `cargo deb` (see docs/install.md, packaging/debian/README.md)
[package.metadata.deb]
maintainer = "Michael Christenson II <m3talsmith@gmail.com>"
copyright = "2026, Michael Christenson II <m3talsmith@gmail.com>"
license-file = ["LICENSE", "0"]
extended-description = """\
Muninn (mnnn) ingests OHLCV market bars from CSV, JSON, HTTP APIs, Redis, SQLite and \
Postgres, normalizes them and stores them in an encrypted SQLite (SQLCipher) database. \
Export to CSV, Parquet or JSON; browse in a terminal UI."""
section = "utils"
priority = "optional"
depends = "libc6 (>= 2.34), libgcc-s1"
assets = [
    ["target/release/mnnn", "usr/bin/", "755"],
    ["man/*.1", "usr/share/man/man1/", "644"],
    ["README.md", "usr/share/doc/muninn/", "644"],
    ["CHANGELOG.md", "usr/share/doc/muninn/", "644"],
    ["assets/fonts/LICENSE-OFL.txt", "usr/share/doc/muninn/LICENSE-FONTS", "644"],
    ["docs/**/*.md", "usr/share/doc/muninn/docs/", "644"],
]

# Fedora/RHEL package: `cargo build --release && cargo generate-rpm` (packaging/fedora)
[package.metadata.generate-rpm]
summary = "Local, encrypted store for OHLCV market bars (mnnn)"
license = "MIT"
release = "1"
assets = [
    { source = "target/release/mnnn", dest = "/usr/bin/mnnn", mode = "755" },
    { source = "man/*.1", dest = "/usr/share/man/man1/", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/muninn/README.md", mode = "644", doc = true },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/muninn/CHANGELOG.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/muninn/LICENSE", mode = "644", doc = true },
    { source = "assets/fonts/LICENSE-OFL.txt", dest = "/usr/share/licenses/muninn/LICENSE-FONTS", mode = "644", doc = true },
]

# Release binaries ship without symbols (smaller; packagers need not strip).
[profile.release]
strip = "symbols"
